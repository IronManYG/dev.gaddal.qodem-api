ktor {
    application {
        modules = [ dev.gaddal.ApplicationKt.module ]
    }
    deployment {
        port = 8080
    }
}
jwt {
    secret = ${?JWT_SECRET}
    issuer = "your-application-name"
    audience = "your-application-audience"
    realm = "your-application-realm"
    accessTokenDuration = 1
    refreshTokenDuration = 30
}